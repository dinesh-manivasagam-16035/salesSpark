<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalesSpark — Revenue Intelligence &amp; Target Management</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header" id="header"></header>

  <!-- Navigation -->
  <nav class="nav-tabs" id="nav"></nav>

  <!-- Main Content -->
  <main class="app-body">
    <div class="tab-content active" id="tab-dashboard"></div>
    <div class="tab-content" id="tab-targets"></div>
    <div class="tab-content" id="tab-leaderboard"></div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>⚙ Settings</h2>
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" value="Admin User" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" value="admin@salesspark.io" />
      </div>
      <div class="form-group">
        <label>Default Currency</label>
        <select>
          <option selected>USD ($)</option>
          <option>EUR (€)</option>
          <option>GBP (£)</option>
          <option>INR (₹)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fiscal Year Start</label>
        <select>
          <option>January</option>
          <option selected>April</option>
          <option>July</option>
          <option>October</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notifications</label>
        <select>
          <option selected>All</option>
          <option>Critical only</option>
          <option>Off</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="settingsClose">Cancel</button>
        <button class="btn btn-primary" id="settingsSave">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
